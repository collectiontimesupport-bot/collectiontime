<!doctype html>
<!-- ==========================================================
     404.html — pagina "non trovata"
     GitHub Pages la mostra quando qualcuno apre un indirizzo che
     non esiste. Può comparire a qualsiasi profondità (es.
     /legami/xyz), per questo tutti i percorsi iniziano con "/"
     (= cartella principale del sito). Aperta dal computer con
     doppio clic non trova stile e bande: sul sito online sì.
     ========================================================== -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata · Collection Time</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A2140">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Stile comune del sito (colori, bande in alto e in basso) -->
<link rel="stylesheet" href="/sito.css?v=9">
<style>
  /* I colori (--ink, --muted, --line, --amber, --white) vengono da sito.css */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--white); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .wrap { width: 100%; max-width: 600px; margin: 0 auto; padding: 72px 20px; text-align: center; }
  /* orologio fermo: la stessa "o" del logo, più grande */
  .clk { width: 88px; height: 88px; display: block; margin: 0 auto 24px; }
  h1 { margin: 0; font: 600 clamp(1.8rem, 4vw, 2.4rem)/1.15 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; text-wrap: balance; }
  h1::after { content: ""; display: block; width: 36px; height: 3px; margin: 16px auto 0; background: var(--amber); border-radius: 2px; }
  p { margin: 18px 0 28px; color: var(--muted); }
  .btn { display: inline-block; background: var(--ink); color: var(--white); font-weight: 600; font-size: .9375rem; text-decoration: none; padding: 10px 22px; border-radius: 8px; transition: background .15s, color .15s; }
  .btn:hover { background: var(--amber); color: var(--ink); }
</style>
</head>
<body>
<!-- Banda in alto: la riempie script.js con header.html. Lasciare vuoto. -->
<div id="header-placeholder"></div>

<!-- ============ CONTENUTO DELLA PAGINA: i testi si cambiano qui ============ -->
<main class="wrap">
  <svg class="clk" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#1A2140" stroke-width="1.6"/><path d="M12 12V6.5M12 12l4 2.3" fill="none" stroke="#F2A900" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="1" fill="#1A2140"/></svg>
  <h1>Questo pezzo non è ancora in collezione</h1>
  <p>La pagina che cerchi non esiste o è stata spostata.</p>
  <a class="btn" href="/">Torna alle collezioni</a>
</main>

<!-- Banda in basso: la riempie script.js con footer.html. Lasciare vuoto. -->
<div id="footer-placeholder"></div>

<script src="/script.js?v=7"></script>
</body>
</html>
