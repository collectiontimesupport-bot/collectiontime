<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ! MODIFICA: nome di questa pagina in <title>, description, og:title, og:description e indirizzo in og:url (righe qui sotto) -->
<title>Kinder Joy · Collection Time</title>
<meta name="description" content="Kinder Joy: le serie di sorpresine dei Kinder Joy, con quelle che ho e quelle che mi mancano.">
<meta name="theme-color" content="#1A2140">
<!-- Icona della scheda, icona per il telefono e anteprima quando condividi il link.
     I file stanno nella cartella principale e in "icone/". -->
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png?v=2">
<link rel="manifest" href="../../site.webmanifest">
<meta property="og:site_name" content="Collection Time">
<meta property="og:type" content="website">
<meta property="og:title" content="Kinder Joy · Collection Time">
<meta property="og:description" content="Kinder Joy: le serie di sorpresine dei Kinder Joy, con quelle che ho e quelle che mi mancano.">
<meta property="og:url" content="https://www.collectiontime.com/kinder/kinder-joy/">
<meta property="og:image" content="https://www.collectiontime.com/icone/anteprima.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- Stile comune del sito (colori, bande in alto e in basso) -->
<link rel="stylesheet" href="../../sito.css?v=2026-09-26k">
<style>
  /* Base della pagina, titolo e card (st-wrap, st-titolo, st-cards…) sono in sito.css:
     qui solo ciò che è diverso in questa pagina. */
  :root {
    /* Colore del titolo, a parte: per cambiarlo basta sostituire questo codice. */
    --titolo: #1A2140; }   /* blu scuro del sito, quasi nero (il rosso è solo per Legami) */
  /* Titolo in carattere di sistema molto grosso (nessun file da scaricare: pagina leggera) */
  .st-titolo { font: 900 clamp(2rem, 4vw, 3rem)/1.1 "Arial Black", "Helvetica Neue", Arial, system-ui, sans-serif; letter-spacing: .02em; color: var(--titolo); }
  /* telefoni: titolo grande come nelle altre sezioni */
  @media (max-width: 520px) { .st-titolo { font-size: 9vw; } }
  /* Card con la foto IN ALTO, come nella sezione LEGO.
     L'immagine va dentro il suo <a>:  <div class="thumb"><img src="..." alt=""></div> */
  .st-card { --foto-h: 170px; }
  .thumb { order: -1; display: grid; place-items: center; height: var(--foto-h); margin-bottom: 4px; }
  .thumb img { max-width: 100%; max-height: var(--foto-h); width: auto; height: auto; object-fit: contain; display: block; }
  /* scritta mostrata finché non c'è nessuna collezione (poi si cancella) */
  .in-arrivo { text-align: center; color: var(--muted); font-size: 1.125rem; margin: 30px 0; }
</style>
</head>
<body>
<!-- Banda in alto (logo, Accedi): la riempie script.js con header.html. Lasciare vuoto. -->
<div id="header-placeholder"></div>

<!-- ============ CONTENUTO DELLA PAGINA: i testi si cambiano qui ============ -->
<main class="st-wrap">
  <!-- ! MODIFICA: dove porta il link per tornare indietro e la scritta dopo la freccia -->
  <a class="st-back" href="../index.html">&larr; Kinder Ferrero</a>
  <!-- ! MODIFICA: titolo della pagina -->
  <h1 class="st-titolo">KINDER JOY</h1>
  <!-- Frase + lente: la lente apre il campo per cercare tra le serie (funziona con script.js) -->
  <div class="st-sub">
    <p class="sub">Cerca una serie</p>
    <div class="st-cerca" id="stCerca">
      <button type="button" aria-label="Cerca una serie" aria-expanded="false" title="Cerca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <input type="search" placeholder="Cerca una serie" aria-label="Cerca una serie" tabindex="-1" autocomplete="off">
    </div>
  </div>
  <p class="st-nessuna" hidden>Nessuna serie trovata.</p>
  <!-- Scritta provvisoria: quando aggiungi la prima serie, cancella questa riga. -->
  <p class="in-arrivo">Le prime serie arrivano presto.</p>
  <!-- TUTTE LE SERIE in ordine di uscita, DALLA PIÙ RECENTE: una serie nuova va aggiunta IN CIMA.
       Una card per ogni serie: per aggiungerne una, copia l'esempio qui sotto,
       togli i segni di commento e cambia cartella, foto e testi.
       data-cerca="..." sul <li> = parole in più che la ricerca trova (es. i nomi delle sorpresine).
       Esempio:
       <li data-cerca="nomi delle sorpresine"><a class="st-card" href="nome-cartella/index.html"><div class="thumb"><img src="nome-cartella/immagini/copertina.webp" alt="" loading="lazy"></div><h2>Nome della serie</h2><p>Anno · numero di sorpresine</p><span class="st-apri">Apri</span></a></li>
  -->
  <!-- DOVE SI METTE LA COPERTINA (la foto in alto nella card)
       • Il file si chiama sempre copertina.webp e sta nella cartella "immagini" della collezione,
         es. nome-cartella/immagini/copertina.webp
       • Per cambiarla basta sostituire il file con uno con lo stesso nome; poi nella riga della card
         metti la data di oggi in "?v=…" in fondo al nome del file (es. copertina.webp?v=2026-09-26, oppure aggiungilo
         se manca): obbliga il browser a scaricare la copertina nuova invece di quella vecchia salvata.
       • Nella card la foto è questa riga, dentro il suo <a> (se manca, la card è senza foto):
         <div class="thumb"><img src="nome-cartella/immagini/copertina.webp" alt="" loading="lazy"></div>
       • Per crearla: _strumenti/strumento-copertina.html (nella cartella principale del sito) (aprilo con Chrome):
         con 1 immagine (la foto di gruppo della serie) la ritaglia e la rimpicciolisce,
         con 2–4 immagini (es. oggetti di serie diverse) le mette una accanto all'altra. -->
  <!-- ! MODIFICA: le card: cartella, foto, nome, testo e parole di ricerca (data-cerca) -->
  <!-- data-per-anno = le card vengono raccolte in tendine, una per anno (lo fa script.js leggendo l'anno scritto nel <p> della card;
       le card senza anno restano normali, sopra). Per tornare a tutte le card aperte, cancella data-per-anno. -->
  <ul class="st-cards" data-per-anno>
  </ul>
</main>

<!-- Banda in basso: la riempie script.js con footer.html. Lasciare vuoto. -->
<div id="footer-placeholder"></div>

<!-- Carica stile comune, bande e Accedi: questa riga serve in ogni pagina -->
<!-- "?v=…" è la versione del file = la DATA dell'ultima modifica (anno-mese-giorno): quando cambi un file .js o .css metti la data di oggi (es. v=2026-09-26)
     in tutte le pagine, così i browser scaricano per forza i file nuovi e non quelli vecchi salvati. -->
<script src="../../script.js?v=2026-09-26m"></script>
</body>
</html>
