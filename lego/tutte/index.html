<!doctype html>
<!-- =====================================================================
     LEGO MINIFIGURES · TUTTE — tutte le minifigure di tutte le serie in una
     sola pagina, in ordine, per vedere al volo quali ho e quali mi mancano.
     ---------------------------------------------------------------------
     Questa pagina NON ha un elenco suo: legge le collezioni dalla home LEGO
     (../index.html, nell'ordine delle card) e le minifigure dall'ELENCO di
     ogni pagina di serie. Quindi, quando aggiungi una serie o cambi un nome,
     qui si aggiorna da solo: non c'è niente da copiare.
     Le spunte "Ce l'ho" sono le stesse delle pagine delle serie (stesso
     archivio nel browser): toccando una minifigura qui, cambia anche là.
     Le foto piccole stanno in "immagini/mini/" di ogni serie (160 × 160 px,
     leggere per il telefono); se ne manca una usa la foto grande.
     ===================================================================== -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutte le LEGO Minifigures · Collection Time</title>
<meta name="description" content="Tutte le LEGO Minifigures in una pagina: quelle che ho e quelle che mi mancano.">
<meta name="theme-color" content="#1A2140">
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png?v=2">
<link rel="manifest" href="../../site.webmanifest">
<meta property="og:site_name" content="Collection Time">
<meta property="og:type" content="website">
<meta property="og:title" content="Tutte le LEGO Minifigures · Collection Time">
<meta property="og:url" content="https://www.collectiontime.com/lego/tutte/">
<meta property="og:image" content="https://www.collectiontime.com/icone/anteprima.jpg">
<meta name="twitter:card" content="summary_large_image">
<!-- Stile comune del sito (colori, bande in alto e in basso) -->
<link rel="stylesheet" href="../../sito.css?v=9">
<style>
  /* I colori (--ink, --muted, --line, --amber, --white) vengono da sito.css */
  :root {
    /* Colore del titolo, a parte: per cambiarlo basta sostituire questo codice. */
    --titolo: #1A2140; }   /* blu scuro del sito, quasi nero */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--white); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { width: 100%; max-width: 1400px; margin: 0 auto; padding: 12px 16px 60px; }
  .backlink { display: inline-block; margin: 0 0 18px; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: 1.125rem; }
  .backlink:hover { color: var(--titolo); }
  h1 { margin: 0; text-align: center; font: 900 clamp(1.8rem, 4vw, 3rem)/1.1 "Arial Black", "Helvetica Neue", Arial, system-ui, sans-serif; letter-spacing: .02em; color: var(--titolo); }
  @media (max-width: 520px) { h1 { font-size: 8.5vw; } }

  /* riga sotto il titolo: conteggio a sinistra, filtro a destra */
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin: 22px 0 16px; }
  .conta { margin: 0; color: var(--muted); }
  .conta strong { color: var(--ink); }
  .filtro { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .filtro button { font: inherit; font-size: .9375rem; border: 0; background: var(--white); color: var(--ink); padding: 8px 14px; cursor: pointer; }
  .filtro button + button { border-left: 1px solid var(--line); }
  .filtro button[aria-pressed="true"] { background: var(--ink); color: var(--white); }

  /* GRIGLIA: tutte le minifigure di fila, senza titoli.
     Ogni casella è larga almeno 76px sul telefono e 96px sul PC. */
  .tutte { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
  @media (min-width: 768px) { .tutte { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; } }
  .tutte button { all: unset; box-sizing: border-box; display: block; width: 100%; aspect-ratio: 1; border-radius: 10px; cursor: pointer; }
  .tutte button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .tutte img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* minifigura che NON ho: grigia e sbiadita; quella che ho: a colori */
  .tutte li:not(.ce) img { filter: grayscale(1); opacity: .3; }
  .tutte li.ce button { background: color-mix(in srgb, var(--amber) 14%, #fff); }
  @media (hover: hover) { .tutte li:not(.ce) button:hover img { opacity: .6; } }
  .attesa { text-align: center; color: var(--muted); padding: 40px 0; }
  .hint { color: var(--muted); font-size: .875rem; margin: 20px 0 0; }
  #status { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 10px; max-width: 90vw; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #status.show { opacity: 1; }
</style>
</head>
<body>
<!-- Banda in alto: la riempie script.js con header.html. Lasciare vuoto. -->
<div id="header-placeholder"></div>

<main class="wrap">
  <a class="backlink" href="../index.html">&larr; LEGO Minifigures</a>
  <h1>TUTTE LE MINIFIGURES</h1>
  <div class="bar">
    <p class="conta" id="conta"></p>
    <div class="filtro" role="group" aria-label="Mostra">
      <button type="button" data-f="tutte" aria-pressed="true">Tutte</button>
      <button type="button" data-f="ce">Ce le ho</button>
      <button type="button" data-f="manca">Mi mancano</button>
    </div>
  </div>
  <p class="attesa" id="attesa">Carico le minifigure…</p>
  <!-- la riempie lo script qui sotto: un <li> per minifigura -->
  <ul class="tutte" id="tutte"></ul>
  <p class="hint">Tocca una minifigura per segnare che ce l'hai (o toglierlo). Tieni il dito sopra (o passa col mouse) per vedere il nome e la serie.</p>
</main>

<!-- Banda in basso: la riempie script.js con footer.html. Lasciare vuoto. -->
<div id="footer-placeholder"></div>
<div id="status" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const lista = $('tutte');
  const STORE = 'penne';
  /* Sul tuo computer (file, localhost, rete di casa) le pagine delle serie usano l'archivio
     "…-anteprima": qui faccio lo stesso, così le spunte coincidono (vedi comune/app.js). */
  const privato = location.protocol === 'file:' ||
    /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname) || /\.local$/.test(location.hostname);
  const archivi = new Map();   /* nome dell'archivio → archivio aperto */
  let tutte = [];              /* { id, nome, serie, foto, db, ce } */
  let filtro = 'tutte';

  function avviso(t) {
    const s = $('status'); s.textContent = t; s.classList.add('show');
    clearTimeout(avviso.t); avviso.t = setTimeout(() => s.classList.remove('show'), 3500);
  }
  const richiesta = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
  function apri(nome) {
    if (!archivi.has(nome)) {
      const r = indexedDB.open(nome, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
      archivi.set(nome, richiesta(r));
    }
    return archivi.get(nome);
  }

  /* 1) le collezioni, nell'ordine delle card della home LEGO */
  async function collezioni() {
    const html = await (await fetch('../index.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    return [...doc.querySelectorAll('.cards a.card')].map(a => ({
      cartella: a.getAttribute('href').replace(/\/?index\.html$/, ''),
      titolo: (a.querySelector('h2') || a).textContent.trim()
    }));
  }
  /* 2) le minifigure di una collezione, lette dall'ELENCO della sua pagina */
  async function minifigure(c) {
    const html = await (await fetch('../' + c.cartella + '/index.html')).text();
    const db = ((html.match(/dbName:\s*"([^"]+)"/) || [])[1] || ('catalogo-' + c.cartella)) + (privato ? '-anteprima' : '');
    const righe = [...html.matchAll(/\{\s*id:\s*"([^"]+)"[^}]*?numero:\s*"([^"]*)"[^}]*?nome:\s*"((?:[^"\\]|\\.)*)"[^}]*?foto:\s*"([^"]+)"/g)];
    return righe.map(m => ({
      id: m[1], nome: m[3].replace(/\\(.)/g, '$1'), serie: c.titolo + ' · ' + m[2],
      foto: '../' + c.cartella + '/' + m[4], db, ce: false
    }));
  }

  function disegna() {
    const n = tutte.filter(p => p.ce).length;
    $('conta').innerHTML = '<strong>' + n + '</strong> su ' + tutte.length + ' · me ne mancano ' + (tutte.length - n);
    lista.querySelectorAll('li').forEach(li => {
      const p = tutte[li.dataset.i];
      li.hidden = (filtro === 'ce' && !p.ce) || (filtro === 'manca' && p.ce);
    });
  }
  function crea() {
    const frag = document.createDocumentFragment();
    tutte.forEach((p, i) => {
      const li = document.createElement('li');
      li.dataset.i = i;
      li.className = p.ce ? 'ce' : '';
      const b = document.createElement('button');
      b.type = 'button';
      b.title = p.nome + ' — ' + p.serie;
      b.setAttribute('aria-label', p.nome + ', ' + p.serie);
      b.setAttribute('aria-pressed', String(p.ce));
      const img = document.createElement('img');
      img.loading = 'lazy'; img.decoding = 'async'; img.alt = '';
      img.width = 160; img.height = 160;
      img.src = p.foto.replace('/immagini/', '/immagini/mini/');     /* foto piccola */
      img.onerror = () => { img.onerror = null; img.src = p.foto; };  /* se manca, la grande */
      b.append(img);
      b.addEventListener('click', () => segna(p, li, b));
      li.append(b);
      frag.append(li);
    });
    lista.append(frag);
  }
  /* segna / toglie "Ce l'ho" nello stesso archivio della pagina della serie */
  async function segna(p, li, b) {
    p.ce = !p.ce;
    li.classList.toggle('ce', p.ce);
    b.setAttribute('aria-pressed', String(p.ce));
    disegna();
    try {
      const db = await apri(p.db);
      const s = db.transaction(STORE, 'readwrite').objectStore(STORE);
      const vecchia = await richiesta(s.get(p.id));
      /* se la pagina della serie non è mai stata aperta, salvo solo la spunta:
         il resto lo completa la pagina della serie la prima volta che la apri */
      await richiesta(db.transaction(STORE, 'readwrite').objectStore(STORE).put(Object.assign(vecchia || { id: p.id }, { owned: p.ce })));
    } catch (e) { avviso('Questo browser non permette di salvare le spunte.'); }
  }

  (async () => {
    try {
      const cols = await collezioni();
      /* scarico gli elenchi insieme (sono piccoli) e li rimetto nell'ordine giusto */
      const gruppi = await Promise.all(cols.map(c => minifigure(c).catch(() => [])));
      tutte = gruppi.flat();
      /* spunte già salvate nel browser */
      const perDb = new Map();
      tutte.forEach(p => { if (!perDb.has(p.db)) perDb.set(p.db, []); perDb.get(p.db).push(p); });
      await Promise.all([...perDb].map(async ([nome, ps]) => {
        try {
          const db = await apri(nome);
          const salvate = await richiesta(db.transaction(STORE).objectStore(STORE).getAll());
          const ce = new Set(salvate.filter(x => x.owned === true).map(x => x.id));
          ps.forEach(p => { p.ce = ce.has(p.id); });
        } catch (e) { /* archivio non leggibile: restano da spuntare */ }
      }));
      $('attesa').hidden = true;
      crea();
      disegna();
    } catch (e) {
      $('attesa').textContent = 'Non riesco a caricare le minifigure. Riprova tra poco.';
    }
  })();

  document.querySelectorAll('.filtro button').forEach(b => b.addEventListener('click', () => {
    filtro = b.dataset.f;
    document.querySelectorAll('.filtro button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    disegna();
  }));
})();
</script>
<!-- Banda in alto e in basso, Esporta/Importa: questa riga serve in ogni pagina -->
<script src="../../script.js?v=7"></script>
</body>
</html>
