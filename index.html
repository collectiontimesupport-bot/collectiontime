<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection Time</title>
<meta name="description" content="Collection Time: il catalogo delle mie collezioni.">
<meta name="theme-color" content="#1A2140">
<!-- Icona della scheda, icona per il telefono e anteprima quando condividi il link.
     I file stanno nella cartella principale e in "icone/". -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta property="og:site_name" content="Collection Time">
<meta property="og:type" content="website">
<meta property="og:title" content="Collection Time">
<meta property="og:description" content="Collection Time: il catalogo delle mie collezioni.">
<meta property="og:url" content="https://www.collectiontime.com/">
<meta property="og:image" content="https://www.collectiontime.com/icone/anteprima.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- Stile comune del sito (colori, bande in alto e in basso) -->
<link rel="stylesheet" href="sito.css?v=6">
<style>
  /* I colori (--ink, --muted, --line, --amber, --white) vengono da sito.css */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--white); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 56px 20px 72px; }
  h1 { margin: 0; text-align: center; font: 600 clamp(2rem, 4vw, 3rem)/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  h1::after { content: ""; display: block; width: 36px; height: 3px; margin: 16px auto 0; background: var(--amber); border-radius: 2px; }
  .sub { margin: 14px 0 40px; text-align: center; color: var(--muted); }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 20px; border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; background: var(--white); transition: border-color .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { border-color: var(--amber); box-shadow: 0 6px 20px rgba(242, 169, 0, .16); outline: none; }
  .card:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  /* Logo scritto della collezione nella card (es. "Legami / Milano"),
     nello stesso carattere del titolo della collezione: Comic Sans MS Bold.
     Il colore è a parte, nella voce --titolo di ogni card. */
  .logo-coll { display: grid; place-content: center; justify-items: center; height: 96px; line-height: 1; color: var(--titolo);
               font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", "Marker Felt", cursive; font-weight: 700; }
  .logo-coll span { font-size: 2.6rem; }
  .logo-coll small { font-size: .95rem; letter-spacing: .18em; text-transform: uppercase; margin-top: 4px; }
  .card h2 { margin: 0; font-size: 1.125rem; }
  .card p { margin: 0; color: var(--muted); font-size: .9375rem; flex: 1; }
  .open { font-weight: 600; font-size: .9375rem; text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 2px; text-underline-offset: 4px; }
</style>
</head>
<body>
<!-- Banda in alto (logo, Esporta, Importa): la riempie script.js con header.html. Lasciare vuoto. -->
<div id="header-placeholder"></div>

<!-- ============ CONTENUTO DELLA PAGINA: i testi si cambiano qui ============ -->
<main class="wrap">
  <h1>Le mie collezioni</h1>
  <p class="sub">Scegli una categoria</p>
  <!-- Una card per ogni categoria: per aggiungerne una, copia un <li> ... </li> e cambia link e testi. -->
  <ul class="cards">
    <li>
      <a class="card" href="legami/index.html">
        <!-- logo scritto: --titolo = colore della collezione (rosso Legami) -->
        <div class="logo-coll" style="--titolo: #E50A15" aria-hidden="true"><span>Legami</span><small>Milano</small></div>
        <h2>Legami</h2>
        <p>Tutte le mie collezioni a tema Legami.</p>
        <span class="open">Apri</span>
      </a>
    </li>
  </ul>
</main>

<!-- Banda in basso: la riempie script.js con footer.html. Lasciare vuoto. -->
<div id="footer-placeholder"></div>

<!-- Carica stile comune, bande e Esporta/Importa: questa riga serve in ogni pagina -->
<!-- "?v=6" è il numero di versione: quando cambi un file .js o .css aumentalo (v=6 → v=7)
     in tutte le pagine, così i browser scaricano per forza i file nuovi e non quelli vecchi salvati. -->
<script src="script.js?v=5"></script>
</body>
</html>
