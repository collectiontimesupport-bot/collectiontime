<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection Time</title>
<meta name="description" content="Collection Time: il catalogo delle mie collezioni.">
<meta name="theme-color" content="#1A2140">
<!-- Icona della scheda, icona per il telefono e anteprima quando condividi il link.
     I file stanno nella cartella principale e in "icone/". -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="site.webmanifest">
<meta property="og:site_name" content="Collection Time">
<meta property="og:type" content="website">
<meta property="og:title" content="Collection Time">
<meta property="og:description" content="Collection Time: il catalogo delle mie collezioni.">
<meta property="og:url" content="https://www.collectiontime.com/">
<meta property="og:image" content="https://www.collectiontime.com/icone/anteprima.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- Stile comune del sito (colori, bande in alto e in basso) -->
<link rel="stylesheet" href="sito.css?v=11">
<!-- scarica subito il carattere dei titoli Legami (vedi sito.css) -->
<link rel="preload" href="comune/caratteri/legami-titolo.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Base della pagina, titolo e card (st-wrap, st-titolo, st-cards…) sono in sito.css:
     qui solo ciò che è diverso in questa pagina. */
  .st-wrap { padding-top: 56px; }   /* niente link "indietro" in alto: più spazio sopra il titolo */
  /* Logo scritto della collezione nella card (es. "Legami / Milano"),
     nello stesso carattere del titolo della collezione (var(--font-legami), in sito.css).
     Il colore è a parte, nella voce --titolo di ogni card. */
  /* margin-top negativo: la scritta parte a circa 5 mm dal bordo alto della card */
  .logo-coll { display: grid; justify-items: center; margin: -3px 0 6px; line-height: 1; color: var(--titolo);
               font-family: var(--font-legami); font-weight: 700; }
  .logo-coll span { font-size: 3.6rem; }   /* grandezza di "Legami" */
  /* "Milano": grandezza (font-size) e distanza da "Legami" (margin-top) */
  .logo-coll small { font-size: 1.7rem; letter-spacing: .18em; text-transform: uppercase; margin-top: 14px; }
  /* card LEGO: stesso carattere delle pagine LEGO (carattere di sistema molto grosso) */
  .logo-coll.lego { font-family: "Arial Black", "Helvetica Neue", Arial, system-ui, sans-serif; font-weight: 900; }
  .logo-coll.lego small { font-size: 1.15rem; letter-spacing: .12em; }
</style>
</head>
<body>
<!-- Banda in alto (logo, Esporta, Importa): la riempie script.js con header.html. Lasciare vuoto. -->
<div id="header-placeholder"></div>

<!-- ============ CONTENUTO DELLA PAGINA: i testi si cambiano qui ============ -->
<main class="st-wrap">
  <h1 class="st-titolo">Le mie collezioni</h1>
  <!-- Frase + lente: la lente apre il campo per cercare tra le categorie (funziona con script.js) -->
  <div class="st-sub">
    <p class="sub">Cerca una categoria</p>
    <div class="st-cerca" id="stCerca">
      <button type="button" aria-label="Cerca una categoria" aria-expanded="false" title="Cerca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <input type="search" placeholder="Cerca una categoria" aria-label="Cerca una categoria" tabindex="-1" autocomplete="off">
    </div>
  </div>
  <p class="st-nessuna" hidden>Nessuna categoria trovata.</p>
  <!-- Una card per ogni categoria: per aggiungerne una, copia un <li> ... </li> e cambia link e testi.
       data-cerca = parole in più che la ricerca trova (es. le collezioni che ci sono dentro). -->
  <ul class="st-cards">
    <li data-cerca="Erasable Pens penne cancellabili Bulb Fiction lampade lampada Righello">
      <a class="st-card" href="legami/index.html" aria-label="Legami Milano">
        <!-- logo scritto: --titolo = colore della collezione (rosso Legami) -->
        <div class="logo-coll" style="--titolo: #E50A15" aria-hidden="true"><span>Legami</span><small>Milano</small></div>
        <p>Tutte le mie collezioni a tema Legami.</p>
        <span class="st-apri">Apri</span>
      </a>
    </li>
    <li data-cerca="LEGO Minifigures minifigure minifig Serie DC Super Heroes DFB Disney Disney 100 Dungeons &amp; Dragons F1 Collectible Race Cars Harry Potter Harry Potter e Animali Fantastici Looney Tunes Marvel Studios Shrek Spider-Man: Across the Spider-Verse Team GB Technic Mighty Machines The LEGO Batman Movie The LEGO Movie The LEGO Movie 2 The LEGO Ninjago Movie The Muppets The Simpsons">
      <a class="st-card" href="lego/index.html" aria-label="LEGO Minifigures">
        <!-- logo scritto: --titolo = colore della collezione (blu scuro del sito, quasi nero) -->
        <div class="logo-coll lego" style="--titolo: #1A2140" aria-hidden="true"><span>LEGO</span><small>Minifigures</small></div>
        <p>Le serie di minifigure da collezione.</p>
        <span class="st-apri">Apri</span>
      </a>
    </li>
  </ul>
</main>

<!-- Banda in basso: la riempie script.js con footer.html. Lasciare vuoto. -->
<div id="footer-placeholder"></div>

<!-- Carica stile comune, bande e Esporta/Importa: questa riga serve in ogni pagina -->
<!-- "?v=8" è il numero di versione: quando cambi un file .js o .css aumentalo (v=8 → v=9)
     in tutte le pagine, così i browser scaricano per forza i file nuovi e non quelli vecchi salvati. -->
<script src="script.js?v=8"></script>
</body>
</html>
