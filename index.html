<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le mie collezioni</title>
<style>
  :root { --ink: #1A2140; --muted: #5D6580; --line: #D5D9E2; --red: #E50A15; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 56px 20px 64px; }
  h1 { margin: 0; text-align: center; font: 600 clamp(2rem, 4vw, 3rem)/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .sub { margin: 10px 0 40px; text-align: center; color: var(--muted); }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 20px; border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; background: #fff; transition: border-color .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { border-color: var(--red); box-shadow: 0 6px 20px rgba(229, 10, 21, .10); outline: none; }
  .thumb { height: 84px; display: grid; place-items: center; }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .card h2 { margin: 0; font-size: 1.125rem; }
  .card p { margin: 0; color: var(--muted); font-size: .9375rem; flex: 1; }
  .open { color: var(--red); font-weight: 600; font-size: .9375rem; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="titolo">Le mie collezioni</h1>
  <p class="sub" id="sottotitolo">Scegli una collezione</p>
  <ul class="cards" id="cards"></ul>
  <p class="empty" id="empty" hidden>Nessuna collezione ancora.</p>
</div>
<script>
/* Elenco di base (se il file collezioni.json non si legge, per esempio aprendo la pagina dal computer) */
const FALLBACK = {"titolo": "Le mie collezioni", "sottotitolo": "Scegli una collezione", "collezioni": [{"titolo": "Legami Erasable Pens", "cartella": "legami-erasable", "descrizione": "Le penne cancellabili Legami, in ordine di catalogo.", "immagine": "legami-erasable/anteprima.png"}]};

(async function () {
  let data = FALLBACK;
  if (/^https?:$/.test(location.protocol)) {
    try {
      const res = await fetch('collezioni.json?v=' + Date.now(), { cache: 'no-store' });
      if (res.ok) { const d = await res.json(); if (Array.isArray(d.collezioni)) data = d; }
    } catch (e) { /* uso l'elenco di base */ }
  }
  if (data.titolo) { document.getElementById('titolo').textContent = data.titolo; document.title = data.titolo; }
  if (data.sottotitolo) document.getElementById('sottotitolo').textContent = data.sottotitolo;
  const list = data.collezioni || [];
  const ul = document.getElementById('cards');
  const local = location.protocol === 'file:';
  list.forEach(c => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'card';
    a.href = c.cartella + (local ? '/index.html' : '/');
    if (c.immagine) {
      const t = document.createElement('div'); t.className = 'thumb';
      const img = document.createElement('img'); img.src = c.immagine; img.alt = ''; t.append(img); a.append(t);
    }
    const h = document.createElement('h2'); h.textContent = c.titolo; a.append(h);
    if (c.descrizione) { const p = document.createElement('p'); p.textContent = c.descrizione; a.append(p); }
    const o = document.createElement('span'); o.className = 'open'; o.textContent = 'Apri \u2192'; a.append(o);
    li.append(a); ul.append(li);
  });
  document.getElementById('empty').hidden = list.length > 0;
})();
</script>
</body>
</html>
