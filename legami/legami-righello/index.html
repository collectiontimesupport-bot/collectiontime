  .wrap { width: 100%; max-width: 700px; margin: 0 auto; padding: 56px 20px 72px; text-align: center; }

  .backlink:hover { color: var(--ink); }
  h1 { margin: 0; font: 600 clamp(1.8rem, 3.6vw, 2.6rem)/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  h1::after { content: ""; display: block; width: 36px; height: 3px; margin: 16px auto 0; background: var(--amber); border-radius: 2px; }
  .sub { margin: 18px 0 0; color: var(--muted); }
</style>
