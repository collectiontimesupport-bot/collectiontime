<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ! MODIFICA: nome di questa pagina in <title>, description, og:title, og:description e indirizzo in og:url (righe qui sotto) -->
<title>Legami · Collection Time</title>
<meta name="description" content="Legami: tutte le mie collezioni a tema Legami.">
<meta name="theme-color" content="#1A2140">
<!-- Icona della scheda, icona per il telefono e anteprima quando condividi il link.
     I file stanno nella cartella principale e in "icone/". -->
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
<link rel="manifest" href="../site.webmanifest">
<meta property="og:site_name" content="Collection Time">
<meta property="og:type" content="website">
<meta property="og:title" content="Legami · Collection Time">
<meta property="og:description" content="Legami: tutte le mie collezioni a tema Legami.">
<meta property="og:url" content="https://www.collectiontime.com/legami/">
<meta property="og:image" content="https://www.collectiontime.com/icone/anteprima.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- Stile comune del sito (colori, bande in alto e in basso) -->
<link rel="stylesheet" href="../sito.css?v=11">
<!-- scarica subito il carattere dei titoli Legami (vedi sito.css) -->
<link rel="preload" href="../comune/caratteri/legami-titolo.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Base della pagina, titolo e card (st-wrap, st-titolo, st-cards…) sono in sito.css:
     qui solo ciò che è diverso in questa pagina. */
  :root {
    /* Colore del titolo, a parte: per cambiarlo basta sostituire questo codice. */
    --titolo: #E50A15; }
  /* Titolo nello stesso carattere del titolo di Erasable (var(--font-legami), in sito.css) */
  .st-titolo { font: 700 clamp(2rem, 4vw, 3rem)/1.1 var(--font-legami); letter-spacing: .01em; color: var(--titolo); }
  /* telefoni: titolo grande come nelle pagine Erasable e Lampada */
  @media (max-width: 520px) { .st-titolo { font-size: 9vw; } }
  /* Card con immagine (es. Erasable): testo e "Apri" a sinistra, immagine a destra.
     Per aggiungere un'immagine a una card basta mettere dentro il suo <a>:
     <div class="thumb"><img src="..." alt=""></div> */
  .st-card:has(.thumb) { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; gap: 10px 16px; }
  .st-card:has(.thumb) > :not(.thumb) { grid-column: 1; }
  .st-card:has(.thumb) .st-apri { justify-self: start; align-self: end; }
  .thumb { grid-column: 2; grid-row: 1 / 4; display: grid; place-items: center; }
  /* Tutte le immagini delle card stanno nello stesso riquadro quadrato,
     così hanno la stessa altezza (la lampadina come le penne). */
  .thumb img { width: 100%; aspect-ratio: 1; max-height: 220px; object-fit: contain; display: block; }
</style>
</head>
<body>
<!-- Banda in alto (logo, Esporta, Importa): la riempie script.js con header.html. Lasciare vuoto. -->
<div id="header-placeholder"></div>

<!-- ============ CONTENUTO DELLA PAGINA: i testi si cambiano qui ============ -->
<main class="st-wrap">
  <!-- ! MODIFICA: dove porta il link per tornare indietro e la scritta dopo la freccia -->
  <a class="st-back" href="../index.html">&larr; Tutte le collezioni</a>
  <!-- ! MODIFICA: titolo della pagina -->
  <h1 class="st-titolo">LEGAMI</h1>
  <!-- Frase + lente: la lente apre il campo per cercare tra le collezioni (funziona con script.js) -->
  <div class="st-sub">
    <p class="sub">Cerca una collezione</p>
    <div class="st-cerca" id="stCerca">
      <button type="button" aria-label="Cerca una collezione" aria-expanded="false" title="Cerca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <input type="search" placeholder="Cerca una collezione" aria-label="Cerca una collezione" tabindex="-1" autocomplete="off">
    </div>
  </div>
  <p class="st-nessuna" hidden>Nessuna collezione trovata.</p>
  <!-- Una card per ogni oggetto: per aggiungerne uno, copia un <li> ... </li> e cambia link e testi.
       Se serve, data-cerca="..." sul <li> aggiunge parole che la ricerca trova. -->
  <!-- DOVE SI METTE LA COPERTINA (la foto in alto nella card)
       • Il file si chiama sempre copertina.webp e sta nella cartella "immagini" della collezione,
         es. nome-cartella/immagini/copertina.webp
       • Per cambiarla basta sostituire il file con uno con lo stesso nome: l'HTML non si tocca.
       • Nella card la foto è questa riga, dentro il suo <a> (se manca, la card è senza foto):
         <div class="thumb"><img src="nome-cartella/immagini/copertina.webp" alt="" loading="lazy"></div>
       • Al posto della copertina si può usare una foto già presente nella cartella
         (come Bulb Fiction, che usa legami-lampada/immagini/08.webp): così non c'è un file in più.
       • Per crearla: _strumenti/strumento-copertina.html (nella cartella principale del sito) (aprilo con Chrome):
         con 1 immagine (la foto di gruppo della serie) la ritaglia e la rimpicciolisce,
         con 2–4 immagini (es. oggetti di serie diverse) le mette una accanto all'altra. -->
  <!-- ! MODIFICA: le card: cartella, foto, nome, testo e parole di ricerca (data-cerca) -->
  <ul class="st-cards">
     <li><a class="st-card" href="legami-erasable/index.html"><div class="thumb"><img src="legami-erasable/immagini/copertina.webp" alt=""></div><h2>Erasable Pens</h2><p>Penne cancellabili </p><span class="st-apri">Apri</span></a></li>
     <li><a class="st-card" href="legami-righello/index.html"><h2>Righello</h2><p>La collezione Legami Righello.</p><span class="st-apri">Apri</span></a></li>
     <li><a class="st-card" href="legami-lampada/index.html"><div class="thumb"><img src="legami-lampada/immagini/08.webp" alt=""></div><h2>Bulb Fiction</h2><p>Lampade </p><span class="st-apri">Apri</span></a></li>
  </ul>
</main>

<!-- Banda in basso: la riempie script.js con footer.html. Lasciare vuoto. -->
<div id="footer-placeholder"></div>

<!-- Carica stile comune, bande e Esporta/Importa: questa riga serve in ogni pagina -->
<!-- "?v=8" è il numero di versione: quando cambi un file .js o .css aumentalo (v=8 → v=9)
     in tutte le pagine, così i browser scaricano per forza i file nuovi e non quelli vecchi salvati. -->
<script src="../script.js?v=8"></script>
</body>
</html>
