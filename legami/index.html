<!-- Stile comune del sito (colori, bande in alto e in basso) -->
<link rel="stylesheet" href="../sito.css?v=7">
<style>
  /* I colori (--ink, --muted, --line, --amber, --white) vengono da sito.css */
  :root {
    /* Colore del titolo, a parte: per cambiarlo basta sostituire questo codice. */
    --titolo: #E50A15; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--white); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 12px 20px 72px; }
  /* link per tornare indietro: grande e facile da toccare, su telefono e su PC */
  .backlink { display: inline-block; margin: 0 0 22px; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: 1.125rem; }
  .backlink:hover { color: var(--ink); }
  /* Titolo nello stesso carattere del titolo di Erasable: Comic Sans MS Bold
     (se il dispositivo non ce l'ha, usa il carattere più simile disponibile). */
  h1 { margin: 0; text-align: center; font: 700 clamp(2rem, 4vw, 3rem)/1.1 "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", "Marker Felt", cursive; letter-spacing: .01em; color: var(--titolo); }
  h1::after { content: ""; display: block; width: 36px; height: 3px; margin: 16px auto 0; background: var(--amber); border-radius: 2px; }
  .sub { margin: 14px 0 40px; text-align: center; color: var(--muted); }
  /* telefoni: titolo grande come nelle pagine Erasable e Lampada */
  @media (max-width: 520px) { h1 { font-size: 9vw; } }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 20px; border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; background: var(--white); transition: border-color .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { border-color: var(--amber); box-shadow: 0 6px 20px rgba(242, 169, 0, .16); outline: none; }
  .card:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  /* Card con immagine (es. Erasable): testo e "Apri" a sinistra, immagine a destra.
     Per aggiungere un'immagine a una card basta mettere dentro il suo <a>:
     <div class="thumb"><img src="..." alt=""></div> */
  .card:has(.thumb) { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; gap: 10px 16px; }
  .card:has(.thumb) > :not(.thumb) { grid-column: 1; }
  .card:has(.thumb) .open { justify-self: start; align-self: end; }
  .thumb { grid-column: 2; grid-row: 1 / 4; display: grid; place-items: center; }
  /* Tutte le immagini delle card stanno nello stesso riquadro quadrato,
     così hanno la stessa altezza (la lampadina come le penne). */
  .thumb img { width: 100%; aspect-ratio: 1; max-height: 220px; object-fit: contain; display: block; }
  .card h2 { margin: 0; font-size: 1.125rem; }
  .card p { margin: 0; color: var(--muted); font-size: .9375rem; flex: 1; }
  .open { font-weight: 600; font-size: .9375rem; text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 2px; text-underline-offset: 4px; }
</style>
