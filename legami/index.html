<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legami · Collection Time</title>
<meta name="description" content="Legami: tutte le mie collezioni a tema Legami.">
<meta name="theme-color" content="#1A2140">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root { --ink: #1A2140; --muted: #5D6580; --line: #D5D9E2; --amber: #F2A900; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #fff; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  #header-placeholder, #footer-placeholder { display: contents; }

  .st-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #fff; }
  .st-brand { display: inline-flex; align-items: center; gap: .45em; font-size: clamp(15px, 4.4vw, 18px); line-height: 1; color: var(--ink); text-decoration: none; }
  .st-brand .mk { width: 1.55em; height: 1.55em; flex: none; }
  .st-wm { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; white-space: nowrap; }
  .st-clk { display: inline-block; width: .74em; height: .74em; vertical-align: -.03em; margin: 0 .03em; }
  .st-top nav { display: flex; gap: 20px; font-size: .875rem; }
  .st-top nav a { color: var(--ink); text-decoration: none; padding: 6px 0; border-bottom: 2px solid transparent; }
  .st-top nav a:hover { border-bottom-color: var(--line); }
  .st-top nav a[aria-current="page"] { border-bottom-color: var(--amber); }

  .st-band { margin-top: auto; background: var(--ink); color: #fff; border-top: 3px solid var(--amber); padding: 16px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: .8125rem; }
  .st-band a { color: #fff; text-underline-offset: 3px; }
  .st-band a:hover { color: var(--amber); }
  .st-band :focus-visible { outline-color: var(--amber); }

  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 56px 20px 72px; }
  .backlink { display: inline-block; margin: 0 0 28px; color: var(--muted); text-decoration: none; font-size: .9375rem; }
  .backlink:hover { color: var(--ink); }
  h1 { margin: 0; text-align: center; font: 600 clamp(2rem, 4vw, 3rem)/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  h1::after { content: ""; display: block; width: 36px; height: 3px; margin: 16px auto 0; background: var(--amber); border-radius: 2px; }
  .sub { margin: 14px 0 40px; text-align: center; color: var(--muted); }
  .cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 20px; border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; background: #fff; transition: border-color .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { border-color: var(--amber); box-shadow: 0 6px 20px rgba(242, 169, 0, .16); outline: none; }
  .card:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .thumb { height: 84px; display: grid; place-items: center; }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .card h2 { margin: 0; font-size: 1.125rem; }
  .card p { margin: 0; color: var(--muted); font-size: .9375rem; flex: 1; }
  .open { font-weight: 600; font-size: .9375rem; text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div id="header-placeholder"></div>

<main class="wrap">
  <a class="backlink" href="../index.html">&larr; Tutte le collezioni</a>
  <h1 id="titolo">Legami</h1>
  <p class="sub" id="sottotitolo">Scegli un oggetto</p>
  <ul class="cards" id="cards" data-src="oggetti.json">
    <!-- Contenuto di base: usato se il browser non riesce a leggere oggetti.json. -->
    <li><a class="card" href="legami-lampada/index.html"><h2>Lampada</h2><p>La collezione Legami Lampada.</p><span class="open">Apri</span></a></li>
    <li><a class="card" href="legami-righello/index.html"><h2>Righello</h2><p>La collezione Legami Righello.</p><span class="open">Apri</span></a></li>
    <li><a class="card" href="legami-erasable/index.html"><h2>Erasable</h2><p>Le penne cancellabili Legami, in ordine di catalogo.</p><span class="open">Apri</span></a></li>
  </ul>
  <p class="empty" id="empty" hidden>Nessun oggetto ancora.</p>
</main>

<div id="footer-placeholder"></div>

<script src="../script.js"></script>
</body>
</html>
