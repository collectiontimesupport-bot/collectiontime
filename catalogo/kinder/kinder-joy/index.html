       Una card per ogni serie: per aggiungerne una, copia l'esempio qui sotto,
       togli i segni di commento e cambia cartella, foto e testi.
       data-cerca="..." sul <li> = parole in più che la ricerca trova (es. i nomi delle sorpresine).
       Esempio:
       <li data-cerca="nomi delle sorpresine"><a class="st-card" href="nome-cartella/index.html"><div class="thumb"><img src="nome-cartella/immagini/copertina.webp" alt="" loading="lazy"></div><h2>Nome della serie</h2><p>Anno · numero di sorpresine</p><span class="st-apri">Apri</span></a></li>
  -->
  <!-- DOVE SI METTE LA COPERTINA (la foto in alto nella card)
       • Il file si chiama sempre copertina.webp e sta nella cartella "immagini" della collezione,
         es. nome-cartella/immagini/copertina.webp
       • Per cambiarla basta sostituire il file con uno con lo stesso nome; poi nella riga della card
         metti la data di oggi in "?v=…" in fondo al nome del file (es. copertina.webp?v=2026-09-26, oppure aggiungilo
         se manca): obbliga il browser a scaricare la copertina nuova invece di quella vecchia salvata.
       • Nella card la foto è questa riga, dentro il suo <a> (se manca, la card è senza foto):
         <div class="thumb"><img src="nome-cartella/immagini/copertina.webp" alt="" loading="lazy"></div>
       • Per crearla: _strumenti/strumento-copertina.html (nella cartella principale del sito) (aprilo con Chrome):
         con 1 immagine (la foto di gruppo della serie) la ritaglia e la rimpicciolisce,
         con 2–4 immagini (es. oggetti di serie diverse) le mette una accanto all'altra. -->
  <!-- ! MODIFICA: le card: cartella, foto, nome, testo e parole di ricerca (data-cerca) -->
