<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Collection Time · Area collaboratori</title>
<style>
:root{color-scheme:light;--bg:#F6F7FA;--card:#fff;--ink:#1A2140;--mut:#454D68;--acc:#1A2140;--acc2:#EEF1F6;--amber:#F2A900;--ok:#1E7F4F;--okbg:#E7F5EE;--warn:#8A5A00;--warnbg:#FFF4D6;--bad:#B42318;--badbg:#FDECEA;--line:#AEB6C9;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.demo{background:#222;color:#fff;padding:8px 16px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.demo b{color:#ffd166}
.seg{display:flex;gap:4px;background:#444;border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#ddd;padding:5px 14px;border-radius:999px;font:inherit;cursor:pointer}
.seg button.on{background:#fff;color:#111}
main{max-width:720px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:19px;margin:0 0 6px}
p{margin:4px 0 12px}.mut{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.big{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.big:hover{border-color:var(--ink)}
.big .ic{font-size:30px;width:52px;height:52px;display:grid;place-items:center;background:var(--acc2);border-radius:12px;flex:none}
.big strong{display:block;font-size:17px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}.btn:hover:not(:disabled){background:#2a3358}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--ink)}.btn.sec:hover:not(:disabled){border-color:var(--amber);background:var(--warnbg)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.ghost{background:none;border:2px solid var(--line);color:var(--ink);font-weight:600}.btn.ghost:hover:not(:disabled){background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bozze{background:var(--warnbg);border:2px solid var(--amber)}.bozze h2{color:var(--ink)}.bozze .mut{color:#5A3D00}.bozze [data-bz]{background:var(--amber);border:2px solid var(--amber);color:var(--ink)}.bozze [data-bz]:hover{background:#FFC21F}.bozze .btn.ghost{border-color:#8A5A00;color:#5A3D00;background:#fff}.bozze .btn.ghost:hover:not(:disabled){background:var(--amber);border-color:var(--amber);color:var(--ink)}
#invia,#invcorr,#sgInvia,#sgmInvia,#cfSi{background:var(--amber);border-color:var(--amber);color:var(--ink)}#invia:hover:not(:disabled),#invcorr:hover:not(:disabled),#sgInvia:hover:not(:disabled),#sgmInvia:hover:not(:disabled),#cfSi:hover:not(:disabled){background:#FFC21F}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber)}
textarea{min-height:70px}
.back{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:0;margin-bottom:6px}
.steps{display:flex;gap:6px;margin:8px 0 14px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--acc)}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.series button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.series button:hover{border-color:var(--ink)}
.series .th{height:76px;border-radius:8px;margin-bottom:8px;display:grid;place-items:center;font-size:28px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--acc2);color:var(--acc);font-weight:700;border:1px solid var(--line)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc2)}
.pieces{display:grid;gap:12px}
.piece{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.piece .img{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/14px 14px;border-radius:8px;height:110px;display:grid;place-items:center;overflow:hidden}
.piece img{max-width:100%;max-height:100%}
.piece .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.piece label{margin:0 0 2px;font-size:12px}
.chk{font-size:13px;margin-top:6px}.chk span{margin-right:10px}
.okc{color:var(--ok)}.wc{color:var(--warn)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba>div{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.ba .img{height:100px;display:grid;place-items:center;font-size:42px;border-radius:8px;margin-bottom:6px}
.ba .before{background:var(--badbg)}.ba .after{background:var(--okbg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 8px 24px #0005;z-index:30;max-width:90%}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20;padding:16px}
.modal>div{background:var(--card);border-radius:var(--r);padding:20px;max-width:420px;width:100%}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.info{background:var(--acc2);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.tog{display:flex;align-items:center;gap:8px}
.sw{position:relative;width:44px;height:26px;background:#bbb;border-radius:99px;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{border:0;background:var(--acc2);color:var(--acc);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}.tabs button.on{background:var(--acc);color:#fff}
.hidden{display:none}
.barra{position:sticky;bottom:0;z-index:7;display:flex;gap:8px;align-items:center;background:var(--bg);padding:10px 0;margin-top:12px;border-top:1px solid var(--line)}

.btn.ok{border-color:var(--ok)}.btn.bad{border-color:var(--bad)}
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--ink);color:#fff}
.top h1{margin:0;font-size:1.05rem;letter-spacing:.01em;color:#fff}.top h1 b{color:var(--amber)}
.card{box-shadow:none}
</style>
</head>

function colSel(o,attr){const i=PALETTE.findIndex(c=>c.nome===o.colore&&c.hex===o.hex);const sc=o._x?'x':(!o.colore&&!o.hex)?'':i>=0?String(i):'x';
 return `<div style="display:flex;gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:${esc(o.hex||'transparent')};flex:none"></span><select ${attr} data-col="sel"><option value="">Seleziona colore…</option>${PALETTE.map((c,k)=>`<option value="${k}" ${sc===String(k)?'selected':''}>${c.nome}</option>`).join('')}<option value="x" ${sc==='x'?'selected':''}>Altro colore…</option></select></div>${sc==='x'?`<div style="margin-top:8px"><input type="text" ${attr} data-col="nome" placeholder="Come si chiama questo colore?" value="${esc(o.colore||'')}"><div class="small mut" style="margin:8px 0 4px">Scegli dalla tabella oppure crea il tuo colore:</div><div style="display:grid;grid-template-columns:repeat(9,1fr);gap:6px">${GRIGLIA.map(h=>`<button type="button" ${attr} data-col="sw" data-hex="${h}" aria-label="${h}" style="height:26px;border-radius:6px;border:${(o.hex||'').toLowerCase()===h?'3px solid var(--acc)':'1px solid var(--line)'};background:${h};cursor:pointer"></button>`).join('')}</div><div class="row" style="margin-top:8px;gap:8px"><input type="color" ${attr} data-col="pick" value="${/^#[0-9a-f]{6}$/i.test(o.hex||'')?o.hex:'#888888'}" style="width:48px;height:38px;border:0;background:none;padding:0"><span class="small mut">Crea il tuo colore (tocca il quadrato e scegli)</span></div></div>`:''}`}
function applicaCol(el,o){const q=el.dataset.col;if(q==='sel'){const v=el.value;if(v===''){o.colore='';o.hex='';o._x=false}else if(v==='x'){o._x=true;o.colore='';o.hex=''}else{o._x=false;o.colore=PALETTE[+v].nome;o.hex=PALETTE[+v].hex}}else if(q==='nome')o.colore=el.value.trim();else if(q==='sw')o.hex=el.dataset.hex;else if(q==='pick')o.hex=el.value}
const norm=n=>n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(Boolean);
const chiave=n=>norm(n).sort().join(' ');
const dividi=t=>t.split(/\s+e\s+|,|;|&/i).map(x=>x.trim()).filter(Boolean);
function confrontaNomi(esistenti,testo){const ris={nuovi:[],dup:[],simili:[]};dividi(testo||'').forEach(n=>{const k=chiave(n),t=norm(n);const ex=esistenti.find(e=>chiave(e)===k);if(ex){ris.dup.push({n,ex});return}
 const sim=esistenti.find(e=>{const te=norm(e);return te.length&&t.length&&(t.every(x=>te.includes(x))||te.every(x=>t.includes(x)))});if(sim)ris.simili.push({n,ex:sim});ris.nuovi.push(n)});return ris}
function listaNomi(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
function msgNomi(esistenti,testo){if(!esistenti||!esistenti.length)return '';const r=confrontaNomi(esistenti,testo);
 return r.dup.map(d=>`✓ ${esc(d.n)} è già nei ringraziamenti di questa serie${d.n!==d.ex?' (come «'+esc(d.ex)+'»)':''}: non lo aggiungo di nuovo.`).concat(r.simili.map(d=>`⚠ Esiste già «${esc(d.ex)}»: è la stessa persona?`)).join('<br>')}

function durl(c){const w=c.toDataURL('image/webp',0.85);return w.startsWith('data:image/webp')?w:c.toDataURL('image/png')}
function elabora(file,cat){
 return new Promise((res,rej)=>{
  const img=new Image();img.onload=()=>{
   const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
   const x=c.getContext('2d');x.drawImage(img,0,0);
   let d;try{d=x.getImageData(0,0,c.width,c.height).data}catch(e){d=null}
   let t=0,l=0,r=c.width-1,b=c.height-1;
   if(d){let mnx=c.width,mny=c.height,mxx=0,mxy=0;
    for(let yy=0;yy<c.height;yy++)for(let xx=0;xx<c.width;xx++)if(d[(yy*c.width+xx)*4+3]>10){if(xx<mnx)mnx=xx;if(xx>mxx)mxx=xx;if(yy<mny)mny=yy;if(yy>mxy)mxy=yy}
    if(mxx>mnx){l=mnx;r=mxx;t=mny;b=mxy}}
   const w=r-l+1,h=b-t+1,o=document.createElement('canvas');
   if(cat==='legami'){const H=640,W=Math.round(w*H/h);o.width=W;o.height=H;o.getContext('2d').drawImage(c,l,t,w,h,0,0,W,H)}
   else{o.width=o.height=560;const s=Math.min(560/w,560/h),dw=w*s,dh=h*s;o.getContext('2d').drawImage(c,l,t,w,h,(560-dw)/2,(560-dh)/2,dw,dh)}
   const url=durl(o);
   res({src:url,w:o.width,h:o.height,kb:Math.round(url.length*0.75/1024/3)});
  };img.onerror=rej;img.src=URL.createObjectURL(file);

function sagRitaglia(c){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let t=c.height,b=-1,l=c.width,r=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>10){if(y<t)t=y;if(y>b)b=y;if(x<l)l=x;if(x>r)r=x}if(b<0)return c;const o=document.createElement('canvas');o.width=r-l+1;o.height=b-t+1;o.getContext('2d').drawImage(c,l,t,o.width,o.height,0,0,o.width,o.height);return o}

  x.font='bold 100px '+FONT;const fs=Math.min(spazio/x.measureText(testo).width*100,traverso*0.7);x.font='bold '+fs+'px '+FONT;const lung=x.measureText(testo).width;x.save();x.translate(cx,cy);if(vert)x.rotate(-Math.PI/2);
