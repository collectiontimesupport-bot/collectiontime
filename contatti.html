<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contatti · Collection Time</title>
<meta name="description" content="Come scrivere a Collection Time.">
<meta name="theme-color" content="#1A2140">
<!-- Icona della scheda, icona per il telefono e anteprima quando condividi il link.
     I file stanno nella cartella principale e in "icone/". -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta property="og:site_name" content="Collection Time">
<meta property="og:type" content="website">
<meta property="og:title" content="Contatti · Collection Time">
<meta property="og:description" content="Come scrivere a Collection Time.">
<meta property="og:url" content="https://www.collectiontime.com/contatti.html">
<meta property="og:image" content="https://www.collectiontime.com/icone/anteprima.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- Stile comune del sito (colori, bande in alto e in basso) -->
<link rel="stylesheet" href="sito.css?v=8">
<style>
  /* I colori (--ink, --muted, --line, --amber, --white) vengono da sito.css */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--white); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .wrap { width: 100%; max-width: 600px; margin: 0 auto; padding: 56px 20px 72px; }
  h1 { margin: 0; font: 600 clamp(2rem, 4vw, 2.6rem)/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  h1::after { content: ""; display: block; width: 36px; height: 3px; margin: 16px 0 0; background: var(--amber); border-radius: 2px; }
  .lead { margin: 18px 0 28px; color: var(--muted); }
  .box { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 16px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; }
  .box svg { flex: none; }
  .who { flex: 1 1 200px; min-width: 0; }
  .lab { font-size: .8125rem; color: var(--muted); }
  .val { font-size: 1.0625rem; color: var(--ink); overflow-wrap: anywhere; }
  a.val { text-underline-offset: 3px; text-decoration-color: var(--amber); text-decoration-thickness: 2px; }
  .btn { display: inline-block; background: var(--ink); color: #fff; font-weight: 600; font-size: .9375rem; text-decoration: none; padding: 10px 22px; border-radius: 8px; transition: background .15s, color .15s; }
  .btn:hover { background: var(--amber); color: var(--ink); }
  @media (max-width: 480px) { .btn { width: 100%; text-align: center; } }
</style>
</head>
<body>
<!-- Banda in alto (logo, Esporta, Importa): la riempie script.js con header.html. Lasciare vuoto. -->
<div id="header-placeholder"></div>

<!-- ============ CONTENUTO DELLA PAGINA: i testi si cambiano qui ============ -->
<main class="wrap">
  <h1>Contatti</h1>
  <p class="lead">Per segnalare un errore, proporre una novità o solo per scrivermi.</p>
  <div class="box">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A2140" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7.5 8 6 8-6"/></svg>
    <div class="who">
      <div class="lab">Email</div>
      <a class="val" id="mailLink">collectiontime.support (chiocciola) gmail.com</a>
    </div>
    <a class="btn" id="mailBtn" hidden>Scrivimi</a>
  </div>
</main>

<!-- Banda in basso: la riempie script.js con footer.html. Lasciare vuoto. -->
<div id="footer-placeholder"></div>

<!-- Carica stile comune, bande e Esporta/Importa: questa riga serve in ogni pagina -->
<!-- "?v=6" è il numero di versione: quando cambi un file .js o .css aumentalo (v=6 → v=7)
     in tutte le pagine, così i browser scaricano per forza i file nuovi e non quelli vecchi salvati. -->
<script src="script.js?v=6"></script>
<script>
/* L'indirizzo viene composto qui, così non compare in chiaro nel codice della pagina (meno spam) */
(function () {
  var a = 'collectiontime.support' + '@' + 'gmail.com';
  var l = document.getElementById('mailLink'), b = document.getElementById('mailBtn');
  l.textContent = a; l.href = 'mailto:' + a;
  b.href = 'mailto:' + a + '?subject=Collection%20Time'; b.hidden = false;
})();
</script>
</body>
</html>
