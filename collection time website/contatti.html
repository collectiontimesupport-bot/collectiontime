<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contatti · Collection Time</title>
<meta name="description" content="Come scrivere a Collection Time.">
<meta name="theme-color" content="#1A2140">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --ink: #1A2140; --muted: #5D6580; --line: #D5D9E2; --amber: #F2A900; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #fff; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .st-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #fff; }
  .st-brand { display: inline-flex; align-items: center; gap: .45em; font-size: clamp(15px, 4.4vw, 18px); line-height: 1; color: var(--ink); text-decoration: none; }
  .st-brand .mk { width: 1.55em; height: 1.55em; flex: none; }
  .st-wm { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; white-space: nowrap; }
  .st-clk { display: inline-block; width: .74em; height: .74em; vertical-align: -.03em; margin: 0 .03em; }
  .st-top nav { display: flex; gap: 20px; font-size: .875rem; }
  .st-top nav a { color: var(--ink); text-decoration: none; padding: 6px 0; border-bottom: 2px solid transparent; }
  .st-top nav a:hover { border-bottom-color: var(--line); }
  .st-top nav a[aria-current="page"] { border-bottom-color: var(--amber); }

  .st-band { margin-top: auto; background: var(--ink); color: #fff; border-top: 3px solid var(--amber); padding: 16px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: .8125rem; }
  .st-band a { color: #fff; text-underline-offset: 3px; }
  .st-band a:hover { color: var(--amber); }
  .st-band :focus-visible { outline-color: var(--amber); }

  .wrap { width: 100%; max-width: 600px; margin: 0 auto; padding: 56px 20px 72px; }
  h1 { margin: 0; font: 600 clamp(2rem, 4vw, 2.6rem)/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  h1::after { content: ""; display: block; width: 36px; height: 3px; margin: 16px 0 0; background: var(--amber); border-radius: 2px; }
  .lead { margin: 18px 0 28px; color: var(--muted); }
  .box { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 16px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; }
  .box svg { flex: none; }
  .who { flex: 1 1 200px; min-width: 0; }
  .lab { font-size: .8125rem; color: var(--muted); }
  .val { font-size: 1.0625rem; color: var(--ink); overflow-wrap: anywhere; }
  a.val { text-underline-offset: 3px; text-decoration-color: var(--amber); text-decoration-thickness: 2px; }
  .btn { display: inline-block; background: var(--ink); color: #fff; font-weight: 600; font-size: .9375rem; text-decoration: none; padding: 10px 22px; border-radius: 8px; transition: background .15s, color .15s; }
  .btn:hover { background: var(--amber); color: var(--ink); }
  @media (max-width: 480px) { .btn { width: 100%; text-align: center; } }
</style>
</head>
<body>
<header class="st-top">
  <a class="st-brand" href="index.html" aria-label="Collection Time, pagina iniziale">
    <svg class="mk" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="10" fill="#F2A900"/><path d="M12 23l7 7 13-14" fill="none" stroke="#1A2140" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="st-wm">Collecti<svg class="st-clk" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#1A2140" stroke-width="2.6"/><path d="M12 12 8 9.7M12 12 17.7 8.7" fill="none" stroke="#F2A900" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="1.3" fill="#1A2140"/></svg>n Time</span>
  </a>
  <nav aria-label="Principale">
    <a href="index.html">Collezioni</a>
    <a href="contatti.html" aria-current="page">Contatti</a>
  </nav>
</header>

<main class="wrap">
  <h1>Contatti</h1>
  <p class="lead">Per segnalare un errore, proporre una novità o solo per scrivermi.</p>
  <div class="box">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A2140" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7.5 8 6 8-6"/></svg>
    <div class="who">
      <div class="lab">Email</div>
      <a class="val" id="mailLink">collectiontime.support (chiocciola) gmail.com</a>
    </div>
    <a class="btn" id="mailBtn" hidden>Scrivimi</a>
  </div>
</main>

<footer class="st-band">
  <span>Collection Time</span>
  <a href="contatti.html">Contatti</a>
</footer>

<script>
/* L'indirizzo viene composto qui, così non compare in chiaro nel codice della pagina (meno spam) */
(function () {
  var a = 'collectiontime.support' + '@' + 'gmail.com';
  var l = document.getElementById('mailLink'), b = document.getElementById('mailBtn');
  l.textContent = a; l.href = 'mailto:' + a;
  b.href = 'mailto:' + a + '?subject=Collection%20Time'; b.hidden = false;
})();
</script>
</body>
</html>
