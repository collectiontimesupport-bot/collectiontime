<!doctype html>
<html lang="it">
<head>

<title>McDonald's · Collection Time</title>

<meta name="theme-color" content="#1A2140">
<!-- Icona della scheda, icona per il telefono e anteprima quando condividi il link.
     I file stanno nella cartella principale e in "icone/". -->
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">

<link rel="manifest" href="../site.webmanifest">
<meta property="og:site_name" content="Collection Time">

<meta property="og:description" content="McDonald's: le sorprese degli Happy Meal e i gadget da collezione.">
<meta property="og:url" content="https://www.collectiontime.com/mcdonalds/">

<meta property="og:image:height" content="630">

<!-- Stile comune del sito (colori, bande in alto e in basso) -->
<link rel="stylesheet" href="../sito.css?v=2026-09-26i">
<style>
  /* Base della pagina, titolo e card (st-wrap, st-titolo, st-cards…) sono in sito.css:
     qui solo ciò che è diverso in questa pagina. */
  :root {
    /* Colore del titolo, a parte: per cambiarlo basta sostituire questo codice. */
    --titolo: #1A2140; }   /* blu scuro del sito, quasi nero (il rosso è solo per Legami) */
  /* Titolo in carattere di sistema molto grosso (nessun file da scaricare: pagina leggera) */
  .st-titolo { font: 900 clamp(2rem, 4vw, 3rem)/1.1 "Arial Black", "Helvetica Neue", Arial, system-ui, sans-serif; letter-spacing: .02em; color: var(--titolo); }
  /* telefoni: titolo grande come nelle altre sezioni */
  @media (max-width: 520px) { .st-titolo { font-size: 9vw; } }
  /* Card con la foto IN ALTO, come nella sezione LEGO.
     L'immagine va dentro il suo <a>:  <div class="thumb"><img src="..." alt=""></div> */
  .st-card { --foto-h: 170px; }
  .thumb { order: -1; display: grid; place-items: center; height: var(--foto-h); margin-bottom: 4px; }
  .thumb img { max-width: 100%; max-height: var(--foto-h); width: auto; height: auto; object-fit: contain; display: block; }
</style>
</head>
<body>
<!-- Banda in alto (logo, Accedi): la riempie script.js con header.html. Lasciare vuoto. -->
<div id="header-placeholder"></div>

<!-- ============ CONTENUTO DELLA PAGINA: i testi si cambiano qui ============ -->
<main class="st-wrap">
  <!-- ! MODIFICA: dove porta il link per tornare indietro e la scritta dopo la freccia -->
  <a class="st-back" href="../index.html">&larr; Tutte le collezioni</a>
  <!-- ! MODIFICA: titolo della pagina -->
  <h1 class="st-titolo">McDONALD'S</h1>
  <!-- Frase + lente: la lente apre il campo per cercare tra le collezioni (funziona con script.js) -->
  <div class="st-sub">
    <p class="sub">Cerca una collezione</p>
    <div class="st-cerca" id="stCerca">
      <button type="button" aria-label="Cerca una collezione" aria-expanded="false" title="Cerca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <input type="search" placeholder="Cerca una collezione" aria-label="Cerca una collezione" tabindex="-1" autocomplete="off">
    </div>
  </div>
  <p class="st-nessuna" hidden>Nessuna collezione trovata.</p>
  <!-- Una card per ogni gruppo: per aggiungerne uno, copia un <li> ... </li> e cambia cartella e testi.
       data-cerca="..." sul <li> = parole in più che la ricerca trova (es. i nomi delle serie). -->
  <!-- DOVE SI METTE LA COPERTINA (la foto in alto nella card)
       • Il file si chiama sempre copertina.webp e sta nella cartella "immagini" della collezione,
         es. nome-cartella/immagini/copertina.webp
       • Per cambiarla basta sostituire il file con uno con lo stesso nome; poi nella riga della card
         metti la data di oggi in "?v=…" in fondo al nome del file (es. copertina.webp?v=2026-09-26, oppure aggiungilo
         se manca): obbliga il browser a scaricare la copertina nuova invece di quella vecchia salvata.
       • Nella card la foto è questa riga, dentro il suo <a> (se manca, la card è senza foto):
         <div class="thumb"><img src="nome-cartella/immagini/copertina.webp" alt="" loading="lazy"></div>
       • Per crearla: _strumenti/strumento-copertina.html (nella cartella principale del sito) (aprilo con Chrome):
         con 1 immagine (la foto di gruppo della serie) la ritaglia e la rimpicciolisce,
         con 2–4 immagini (es. oggetti di serie diverse) le mette una accanto all'altra. -->
  <!-- ! MODIFICA: le card: cartella, foto, nome, testo e parole di ricerca (data-cerca) -->
  <ul class="st-cards">
    <li data-cerca="Happy Meal sorprese giocattoli giochi pupazzetti bambini The Minecraft Movie Creeper Steve Squishmallows peluche Lil McDonald's miniature Disneyland 70 Disney Hello Kitty Ninja Turtles Super Mario Stranger Things SpongeBob One Piece UNO Anime Naruto Grinch Max TinyTAN BTS Care Bears Orsetti del Cuore Halloween Jurassic World dinosauri Sonic Mario Kart Squishmallows Halloween Cattivissimo Me 4 Minions Pet Simulator Panini Family figurine Wiltopia Yu-Gi-Oh Dobble MultiVersus Sonic the Hedgehog Elf on the Shelf Adopt Me Hot Wheels Karma"><a class="st-card" href="happy-meal/index.html"><div class="thumb"><img src="happy-meal/copertina.webp?v=1" alt="" loading="lazy"></div><h2>Happy Meal</h2><p>Le sorprese degli Happy Meal.</p><span class="st-apri">Apri</span></a></li>
    <li data-cerca="Gadget oggetti bicchieri tazze promozioni Back to School scuola astucci penne righelli Spider-Man monete bicchieri Mondiali Friends tazze PLAYMOBIL Crayola Adopt Me Roblox Back to School 2025 kit scuola KPop Demon Hunters photocard Merry Grinchmas calze Grinch teli mare Minecraft Movie Meal palloni calcio pallavolo"><a class="st-card" href="gadget/index.html"><div class="thumb"><img src="gadget/copertina.webp" alt="" loading="lazy"></div><h2>Gadget</h2><p>I gadget e gli oggetti da collezione.</p><span class="st-apri">Apri</span></a></li>
      <li data-cerca="Libri libro Happy Meal Readers Grinch Natale Little People Big Dreams Katherine Johnson Wilma Rudolph Van Gogh Mozart Mary Kom Helen Keller Steve Irwin Mindy Kaling Tenzing Norgay Care Bears Beary Best Friends Minecraft Adventures Cattivissimo Me 4 Minions Ecco i personaggi"><a class="st-card" href="libri/index.html"><div class="thumb"><img src="libri/immagini/copertina.webp?v=1" alt="" loading="lazy"></div><h2>Libri</h2><p>I libri degli Happy Meal.</p><span class="st-apri">Apri</span></a></li>
  </ul>
</main>

<!-- Banda in basso: la riempie script.js con footer.html. Lasciare vuoto. -->
<div id="footer-placeholder"></div>

<!-- Carica stile comune, bande e Accedi: questa riga serve in ogni pagina -->
<!-- "?v=…" è la versione del file = la DATA dell'ultima modifica (anno-mese-giorno): quando cambi un file .js o .css metti la data di oggi (es. v=2026-09-26)
     in tutte le pagine, così i browser scaricano per forza i file nuovi e non quelli vecchi salvati. -->
<script src="../script.js?v=2026-09-26l"></script>
</body>
</html>
