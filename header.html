<!-- ==========================================================
     header.html — BANDA IN ALTO, uguale in tutte le pagine
     Viene inserita da script.js nel segnaposto
     <div id="header-placeholder"></div> di ogni pagina.
     · il logo porta alla pagina iniziale
     · Esporta / Importa: il loro funzionamento è in script.js
       (sezione "Esporta / Importa"); gli id stEsporta,
       stImporta e stImportaFile NON vanno cambiati
     · l'aspetto (colori, misure, banda fissa) è in sito.css
     I link si scrivono come se la pagina fosse nella cartella
     principale (es. "index.html"): script.js li corregge da solo.
     ========================================================== -->
<header class="st-top">
  <a class="st-brand" href="index.html" aria-label="Collection Time, pagina iniziale">
    <svg class="mk" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="10" fill="#F2A900"/><path d="M12 23l7 7 13-14" fill="none" stroke="#1A2140" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="st-wm">Collecti<svg class="st-clk" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#1A2140" stroke-width="2.6"/><path d="M12 12 8 9.7M12 12 17.7 8.7" fill="none" stroke="#F2A900" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="1.3" fill="#1A2140"/></svg>n Time</span>
  </a>
  <!-- Esporta e Importa valgono per TUTTE le collezioni del sito (vedi script.js) -->
  <nav aria-label="Backup">
    <button type="button" id="stEsporta" title="Salva in un file le tue spunte, note e hashtag di tutte le collezioni">Esporta</button>
    <button type="button" id="stImporta" title="Carica un file salvato con Esporta">Importa</button>
    <input type="file" id="stImportaFile" accept="application/json,.json" hidden>
  </nav>
</header>
